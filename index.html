<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTG Finance Portal</title>
<meta name="robots" content="noindex">
<!-- The portal is invite-only, so the front door is the sign-in screen, not a marketing pitch.
     This file exists rather than pointing everything straight at app.html because index.html is the
     logout destination in four places (logout, idle timeout, session expiry, the sign-in prompt) —
     deleting it would send every one of those to a 404.

     The old marketing page (landing.html) was deleted — it was orphaned, nothing linked to it, and it
     was marketing copy for an invite-only portal. It is in git history if it is ever wanted back.

     replace() rather than assign(): otherwise Back from the login screen lands here and bounces
     forward again, trapping the user. The query string is carried through so ?idle=1 survives. -->
<meta http-equiv="refresh" content="0;url=app.html">
<link rel="canonical" href="app.html">
<style>
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1216;
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#9aa4b2}
  a{color:#f08a7a}
</style>
</head>
<body>
<script>
  // Runs before the meta refresh in every browser that has JS, so the redirect is instant and the
  // query string is preserved.
  location.replace('app.html' + (location.search || '') + (location.hash || ''));
</script>
<noscript><p>Continue to the <a href="app.html">CTG Finance Portal sign-in</a>.</p></noscript>
</body>
</html>
