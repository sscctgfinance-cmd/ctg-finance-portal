<!-- #upload -->
<div class="panel" style="max-width:560px">
<div class="panel-hd">
<h3>Document Upload</h3>
</div>
<p class="muted" style="font-size:13px;margin:0 0 18px">Upload invoices, receipts, or bank statements for processing by finance.</p>
<div class="fld">
<label>Company</label>
<select id="up_tenant">
<option value="11111111-1111-4111-8111-111111111111">SKINDAE SDN BHD</option>
<option value="22222222-2222-4222-8222-222222222222">I PROCARE MALAYSIA SDN BHD</option>
</select>
</div>
<div class="fld">
<label>Category</label>
<select id="up_cat">
<option>AP Supplier Bill</option>
<option>Reimbursement</option>
<option>Bank Statement</option>
<option>Other</option>
</select>
</div>
<div class="fld">
<label>File <span style="color:var(--muted);text-transform:none;letter-spacing:0">(PDF / Image / Excel)</span>
</label>
<input type="file" id="up_file" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.csv" onchange="upClearScan()"/>
</div>
<button type="button" class="btn" style="width:100%;justify-content:center;margin:-4px 0 14px;background:linear-gradient(180deg,rgba(226,96,75,.18),rgba(226,96,75,.08));border-color:rgba(226,96,75,.4)" onclick="upScan()">📷 Scan document → PDF <span style="opacity:.7;font-weight:400">— auto-crop, multi-page</span>
</button>
<div id="up_scan_note" style="margin:-6px 0 12px">
</div>
<div class="fld">
<label>Note <span style="color:var(--muted);text-transform:none;letter-spacing:0">(Optional)</span>
</label>
<textarea id="up_note" placeholder="e.g. March rent invoice">
</textarea>
</div>
<button class="btn p" onclick="doUpload(this)">⬆ Upload</button>
<div id="upres" style="margin-top:14px">
</div>
</div>
