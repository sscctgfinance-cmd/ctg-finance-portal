<!-- #ocr -->
<div class="panel" style="max-width:900px">
<div class="panel-hd">
<h3>🤖 Smart OCR — Upload a supplier invoice / receipt</h3>
</div>
<p class="muted" style="font-size:12.5px;margin:0 0 14px;line-height:1.6">Upload an invoice or receipt (image or PDF). AI reads it, extracts vendor / date / line items / tax / suggested GL account. Review → one click creates a <b>DRAFT Bill</b> in Xero with the file attached. Powered by Claude vision.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
<div>
<label style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Post to company</label>
<select id="ocr_tenant" style="width:100%">
<option value="11111111-1111-4111-8111-111111111111">SKINDAE SDN BHD</option>
<option value="22222222-2222-4222-8222-222222222222">I PROCARE MALAYSIA SDN BHD</option>
</select>
</div>
<div>
<label style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Receipt / invoice file</label>
<input type="file" id="ocr_file" accept="image/png,image/jpeg,image/webp,application/pdf" onchange="ocrPick(this)" style="width:100%"/>
</div>
</div>
<button type="button" class="btn" style="width:100%;margin-bottom:10px;justify-content:center;background:linear-gradient(180deg,rgba(226,96,75,.18),rgba(226,96,75,.08));border-color:rgba(226,96,75,.4)" onclick="ocrScan()">📷 Scan with camera <span style="opacity:.7;font-weight:400">— auto-crop &amp; clean like a scanner</span>
</button>
<button class="btn p" id="ocr_extract_btn" onclick="ocrExtract()" disabled>🧠 Extract with AI</button>
<div id="ocr_out" style="margin-top:14px">
</div>
</div>
