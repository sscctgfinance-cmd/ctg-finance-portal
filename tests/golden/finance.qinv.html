<!-- #qinv -->
<div class="panel" style="max-width:880px">
<div class="panel-hd">
<h3>Quick Invoice → Xero</h3>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="fld">
<label>Company</label>
<select id="qi_co" onchange="qiMeta()">
<option value="">— select —</option>
<option value="11111111-1111-4111-8111-111111111111">SKINDAE SDN BHD</option>
<option value="22222222-2222-4222-8222-222222222222">I PROCARE MALAYSIA SDN BHD</option>
</select>
</div>
<div class="fld">
<label>Customer</label>
<input id="qi_cust" list="qi_contacts" placeholder="type or pick"/>
<datalist id="qi_contacts">
</datalist>
</div>
</div>
<div class="fld">
<label>Reference</label>
<input id="qi_ref" placeholder="optional"/>
</div>
<div class="fld">
<label>Line items</label>
<div id="qi_lines">
</div>
<button class="btn sm" onclick="qiAddLine()">+ Add line</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="fld">
<label>Date</label>
<input type="date" id="qi_date"/>
</div>
<div class="fld">
<label>Due date</label>
<input type="date" id="qi_due"/>
</div>
</div>
<label style="display:flex;gap:7px;align-items:center;font-size:12px;color:var(--text-soft);margin-bottom:10px">
<input type="checkbox" id="qi_test" checked style="width:auto"/> Test mode (don't post)</label>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn" onclick="qiPreview()">👁 Preview invoice</button>
<button class="btn p qi-create-btn" id="qi-create-btn" onclick="qiCreate()">Create invoice in Xero →</button>
</div>
<div id="qi_out" style="margin-top:12px">
</div>
</div>
