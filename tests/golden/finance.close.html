<!-- #close -->
<div class="panel">
<div class="panel-hd">
<h3>📋 Month-end close</h3>
<div style="display:flex;gap:8px;align-items:center">
<input type="month" id="close_period" value="2026-08" onchange="closeLoad()"/>
<button class="btn p" onclick="closeLoad()">↻ Load</button>
</div>
</div>
<div id="close_out" class="muted">Loading…</div>
</div>
<!-- #close_out -->
<div style="margin-bottom:16px">
<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
<span class="muted">1 / 5 tasks done</span>
<span style="font-weight:800;color:var(--coral-soft)">20%</span>
</div>
<div style="height:9px;border-radius:6px;background:rgba(7,13,23,.6);overflow:hidden">
<div style="height:100%;width:20%;background:linear-gradient(90deg,var(--coral),var(--green-soft));transition:width .3s">
</div>
</div>
</div>
<div class="tbl-wrap">
<table class="bigtable">
<thead>
<tr>
<th>
</th>
<th>Task</th>
<th>Status</th>
<th>Assignee</th>
</tr>
</thead>
<tbody>
<tr>
<td style="width:34px;text-align:center">
<input type="checkbox" checked onchange="closeSet('c1',this.checked?'done':'pending')" style="width:auto;cursor:pointer"/>
</td>
<td>
<b style="opacity:.55">Bank reconciliation — all accounts</b> <span class="pill pill-coral" style="font-size:9px">Bank</span>
</td>
<td>
<select onchange="closeSet('c1',this.value)" style="font-size:11.5px;padding:5px 9px">
<option value="pending">Pending</option>
<option value="in_progress">In progress</option>
<option value="done" selected>Done</option>
</select>
</td>
<td>
<input value="AZLINA" placeholder="assign…" onblur="closeAssign('c1',this.value)" style="font-size:11.5px;padding:5px 9px;width:120px"/>
</td>
</tr>

<option value="done">Done</option>
