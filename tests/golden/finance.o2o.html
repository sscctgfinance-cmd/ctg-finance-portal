<!-- #o2o -->
<div class="panel">
<div class="panel-hd">
<h3>O2O Pharmacy Billing → Xero</h3>
</div>
<div class="bar" style="margin:0 0 12px">
<span style="font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700">Issue into</span>
<select id="o2o-tenant" onchange="o2oOnTenantChange(this)" style="min-width:230px">
<option value="11111111-1111-4111-8111-111111111111" selected>SKINDAE SDN BHD</option>
<option value="22222222-2222-4222-8222-222222222222">I PROCARE MALAYSIA SDN BHD</option>
</select>
</div>
<p class="muted" style="font-size:13px;margin:0 0 6px">Upload the monthly O2O billing Excel. It is parsed in your browser — preview each pharmacy invoice, then issue them into the selected company's Xero.</p>
<p id="o2o-tenant-note" class="muted" style="font-size:12px;margin:0 0 14px;line-height:1.55">
</p>
<div class="bar" style="margin:0 0 10px">
<span style="font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700">Invoice date</span>
<input type="date" id="o2o-invdate" value="2026-08-18" style="min-width:150px"/>
<span style="font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700">Due date</span>
<input type="date" id="o2o-duedate" value="2026-09-17" style="min-width:150px"/>
<button class="btn" type="button" onclick="o2oResetDates()" style="padding:6px 11px;font-size:11.5px">Reset</button>
</div>
<div class="bar" style="margin:0 0 10px">
<span style="font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700">Invoice #</span>
<input type="text" id="o2o-invprefix" placeholder="Prefix (e.g. SK-2606-)" oninput="o2oPreviewNums()" style="min-width:160px"/>
<input type="text" id="o2o-invstart" placeholder="Start # (e.g. 001)" oninput="o2oPreviewNums()" style="min-width:130px"/>
<span id="o2o-invnum-preview" class="muted" style="font-size:12px;flex:1;min-width:200px">Leave empty → Xero auto-generates</span>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<input type="file" id="o2o_file" accept=".xlsx" onchange="o2oPick(this)"/>
<label style="display:flex;gap:7px;align-items:center;font-size:12px;color:var(--text-soft)">
<input type="checkbox" id="o2o-test" checked style="width:auto"/> Test mode (don't post)</label>
<button class="btn p" id="o2o-issue" onclick="o2oIssue()" disabled>Issue invoices in Xero →</button>
</div>
<div id="o2o-out" style="margin-top:14px">
<p class="muted">Pick the Excel to preview.</p>
</div>
</div>
