name: CI — lint & payroll tests

# Runs on EVERY push and PR, including changes to hros.html.
#
# Why this exists: until now nothing checked hros.html at all. It is one ~500 KB inline <script>, so a
# single syntax error is a white screen for every employee, published straight to GitHub Pages, and
# discovered by a phone call. The lint gate that has caught real syntax errors during development only
# existed as a command someone remembered to run by hand.
#
# This job does NOT block the deploy workflow (they run independently) — it is the signal. Make it a
# required status check on main in the repo's branch-protection settings to turn it into a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Extract inline scripts
        # Written to a repo-local dir, not /tmp, so this behaves identically when run by hand on Windows.
        # FAIL-CLOSED: if extraction produces nothing, the later steps must not silently "pass" because
        # there was no file to find a SyntaxError in. (The first draft of this workflow had exactly that
        # bug — a missing file grepped clean and reported OK.)
        run: |
          set -e
          mkdir -p .ci
          for f in hros.html app.html index.html; do
            [ -f "$f" ] || continue
            deno eval "
              const html = await Deno.readTextFile('$f');
              const blocks = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
              if (!blocks.length) { console.error('no inline <script> found in $f'); Deno.exit(1); }
              await Deno.writeTextFile('.ci/$f.js', blocks.join('\n;\n'));
              console.log('$f -> .ci/$f.js (' + blocks.length + ' block(s))');
            "
            test -s ".ci/$f.js"
          done
          # common.js (PR #28) is a real <script src=> file, so the matcher above cannot see it — but both
          # apps load it, so a syntax error in it white-screens Finance OS and HR OS at once. Copy it in
          # so the lint loop below picks it up. FAIL-CLOSED: missing or empty is an error, not a skip.
          if [ ! -s common.js ]; then
            echo "::error::common.js is missing or empty — both app.html and hros.html load it, so it must be syntax-checked, not skipped."
            exit 1
          fi
          cp common.js .ci/common.js
          echo "common.js -> .ci/common.js ($(wc -c < .ci/common.js | tr -d ' ') bytes)"

          # hros.html is the big one; anything tiny means the extraction silently broke.
          bytes=$(wc -c < .ci/hros.html.js)
          echo "extracted hros script: $bytes bytes"
          if [ "$bytes" -lt 200000 ]; then
            echo "::error::Extracted hros.html script is only $bytes bytes — extraction is broken, so the checks below would be meaningless."
            exit 1
          fi

      - name: Syntax-check the single-file apps
        # A single syntax error here is a white screen for every user, published straight to Pages.
        run: |
          set -e
          fail=0
          for js in .ci/*.js; do
            out=$(deno lint "$js" 2>&1 || true)
            # Fail-closed: no output at all means lint did not actually inspect the file.
            if [ -z "$out" ]; then
              echo "::error::deno lint produced no output for $js — treating as a failed check."
              exit 1
            fi
            if echo "$out" | grep -qiE "SyntaxError|Unexpected token|Expression expected"; then
              echo "::error file=$js::$js does not parse — this would white-screen the app for every user."
              echo "$out" | grep -iE -A4 "SyntaxError|Unexpected token|Expression expected" | head -20
              fail=1
            else
              echo "$js parses OK"
            fi
          done
          exit $fail

      - name: Guard against duplicate top-level declarations in hros.html
        # A duplicate top-level `const`/`let`/`class` has taken the portal down before (BOOT_ERROR 503).
        # `var`/`function` redeclarations are legal and this codebase has a known baseline of 6 — fail if
        # that number GROWS, so the gate is useful without demanding a big cleanup first. Also fail if it
        # cannot be measured at all, rather than reading "0 findings" as good news.
        run: |
          set -e
          test -s .ci/hros.html.js
          out=$(deno lint .ci/hros.html.js 2>&1 || true)
          [ -n "$out" ] || { echo "::error::no lint output — cannot measure the no-redeclare baseline."; exit 1; }
          n=$(echo "$out" | grep -c "no-redeclare" || true)
          echo "no-redeclare findings: $n (baseline 6)"
          if [ "$n" -gt 6 ]; then
            echo "::error::no-redeclare rose to $n (baseline 6). A duplicate top-level declaration can take the whole app down."
            echo "$out" | grep -B2 -A6 "no-redeclare" | head -40
            exit 1
          fi

      - name: Backend parses
        # v209: the edge function is a directory of modules, not one file. Lint ALL of them — a syntax
        # error in hr.ts is exactly as fatal at boot as one in the router, and linting only index.ts
        # would have checked 9 KB of a 600 KB function. Fail-closed on both counts: refuse if the
        # expected modules are not there, and refuse if lint produced no output for a file (which means
        # it did not actually inspect it, so "no SyntaxError found" is not good news).
        run: |
          set -e
          d="supabase/functions/portal"
          n=$(ls "$d"/*.ts | wc -l | tr -d " ")
          echo "linting $n module(s) in $d"
          if [ "$n" -lt 4 ]; then
            echo "::error::Only $n .ts file(s) in $d — expected the router plus lib.ts / hr.ts / finance.ts."
            exit 1
          fi
          fail=0
          for f in "$d"/*.ts; do
            out=$(deno lint "$f" 2>&1 || true)
            if [ -z "$out" ]; then
              echo "::error::deno lint produced no output for $f — treating as a failed check."
              exit 1
            fi
            if echo "$out" | grep -qiE "SyntaxError|Unexpected token|Expression expected"; then
              echo "::error file=$f::$f does not parse — the whole portal would fail to boot."
              echo "$out" | grep -iE -A4 "SyntaxError|Unexpected token|Expression expected" | head -20
              fail=1
            else
              echo "$f parses OK"
            fi
          done
          exit $fail

      - name: Edge function is the single source of truth
        # Replaces the old "matches portal_current.ts" diff check. portal_current.ts was a byte-identical
        # duplicate at the repo root that the deploy workflow copied over index.ts; it could not survive
        # the split into modules, so it is gone and supabase/functions/portal/ is the only copy. This
        # step exists so the duplicate cannot quietly come back — two copies is how a reviewer ends up
        # reading different code from what ships.
        run: |
          set -e
          if [ -e portal_current.ts ]; then
            echo "::error::portal_current.ts is back. The edge function lives ONLY in supabase/functions/portal/ — a second copy will drift from it silently."
            exit 1
          fi
          test -s supabase/functions/portal/index.ts
          grep -q "Deno.serve" supabase/functions/portal/index.ts
          echo "supabase/functions/portal/ is the single source of truth."

      - name: Payroll tests, and the router still routes
        # The three that matter most:
        #  - the gazetted SOCSO/EIS anchors (a wrong table over-deducts from every employee, silently)
        #  - frontend/backend parity (any drift 409s payroll for the whole company, unrecoverably)
        #  - route parity (v209): boots the edge function offline and replays an anonymous POST against
        #    all 203 actions, comparing to a golden captured before the module split. Catches a dropped
        #    handler and a lost auth gate — the ~200 actions have no other coverage.
        run: deno test --allow-read tests/
