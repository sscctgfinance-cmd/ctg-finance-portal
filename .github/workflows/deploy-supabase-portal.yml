name: Deploy Supabase Portal Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # v209: the function is a directory of modules, not one file. Trigger on ALL of it — a change to
      # hr.ts or lib.ts is just as much a deploy as a change to the router, and a `paths:` list that
      # names individual files would silently NOT deploy them.
      - supabase/functions/portal/**
      - supabase/config.toml
      - .github/workflows/deploy-supabase-portal.yml

# Never let two deploys race each other onto the same function.
concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI (direct download)
        # supabase/setup-cli@v1 has been flaky (release-page fetch failures). Install
        # the CLI directly from the GitHub releases tarball, which is a stable URL.
        run: |
          set -e
          cd /tmp
          curl -fsSL -o supabase.tar.gz https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          tar -xzf supabase.tar.gz
          sudo mv supabase /usr/local/bin/supabase
          supabase --version

      - name: Guard against stub / truncated source
        # A truncated or stub source is the #1 way production has gone down. Before v209 this was one
        # file, so one byte count caught it. It is now a directory, and a total-bytes check alone would
        # NOT: a stubbed 200-byte index.ts sitting next to three intact modules still totals ~600 KB and
        # would sail through. So this checks the total AND pins each file by a marker only its real
        # contents carry, AND counts the action branches — the router is worthless if the handler chains
        # it delegates to have been truncated away.
        run: |
          set -e
          d="supabase/functions/portal"
          ls -l "$d"

          # 1. Every module must be present. A missing one is a broken import at boot, not a small deploy.
          for f in index.ts lib.ts hr.ts finance.ts; do
            if [ ! -s "$d/$f" ]; then
              echo "::error::Refusing to deploy — $d/$f is missing or empty."
              exit 1
            fi
          done

          # 2. Total size across the function directory (the real tree is ~600 KB).
          bytes=$(cat "$d"/*.ts | wc -c | tr -d " ")
          echo "function directory is $bytes bytes across $(ls "$d"/*.ts | wc -l) modules"
          if [ "$bytes" -lt 480000 ]; then
            echo "::error::Refusing to deploy — the function directory is only $bytes bytes (expected ~600 KB). Looks like a stub/truncated source."
            exit 1
          fi

          # 3. Per-file markers. These are what a total-bytes check cannot do: they fail if any ONE
          #    module is stubbed while the others are intact.
          check_marker () {
            if ! grep -q "$2" "$d/$1"; then
              echo "::error::Refusing to deploy — required marker '$2' missing from $d/$1."
              exit 1
            fi
            echo "  ✓ $1 contains $2"
          }
          check_marker index.ts   "portal up"        # the GET health response the check below looks for
          check_marker index.ts   "Deno.serve"       # the request entry itself
          check_marker index.ts   "financeRoutes"    # the router still delegates to both chains
          check_marker index.ts   "hrRoutes"
          check_marker lib.ts     "processApEmail"   # AP inbound email pipeline
          check_marker finance.ts "pnl_report"       # Finance OS handler chain
          check_marker hr.ts      "hr_emp_save"      # HR OS handler chain

          # 4. The handler chains themselves. A truncated chain is a silently dead feature per branch.
          #
          #    THIS NUMBER IS A BASELINE, NOT A CONSTANT — update it in the SAME commit that adds or
          #    removes a handler, the way the test suite holds its no-redeclare baseline. It was left
          #    at 209 when v224 retired the six Web Push actions, which took the real count to 204 and
          #    made EVERY deploy from that commit onward refuse. The last function that reached
          #    production was 185537d (21 Aug); v224's server half and everything after it stayed in
          #    git while merges kept landing. A guard against a truncated source had become a guard
          #    against shipping at all, and nothing said so out loud — the workflow simply went red in
          #    a place nobody was watching, in BOTH repos, since both run this deploy.
          EXPECTED_ACTIONS=204
          actions=$(grep -ho 'api === "' "$d"/*.ts | wc -l | tr -d " ")
          echo "action branches: $actions (baseline $EXPECTED_ACTIONS)"
          if [ "$actions" -lt "$EXPECTED_ACTIONS" ]; then
            echo "::error::Refusing to deploy — $actions 'api === \"...\"' branches found, baseline is $EXPECTED_ACTIONS. Either the handler chain has been truncated, or a handler was removed on purpose and this baseline was not updated in the same commit."
            exit 1
          fi
          # Growing is fine and needs no edit; shrinking must be deliberate. Say when it has grown, so
          # the baseline can be raised while somebody is looking at it.
          if [ "$actions" -gt "$EXPECTED_ACTIONS" ]; then
            echo "::notice::$actions handlers, baseline $EXPECTED_ACTIONS — raise EXPECTED_ACTIONS in this workflow."
          fi

          # 5. Unchanged from before: never deploy a GitHub-raw bootstrap instead of the real source.
          if grep -rq "raw.githubusercontent" "$d"; then
            echo "::error::Refusing to deploy — source still contains a GitHub-raw bootstrap import (fragile). Deploy the real inline source instead."
            exit 1
          fi
          echo "Source guard passed."

      - name: Deploy portal Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Supabase deploys occasionally 5xx transiently; retry twice before giving up.
        # IMPORTANT: pipefail so `supabase deploy | tee` propagates the deploy exit code
        # (previously tee always returned 0, so retry-loop thought failure was success).
        run: |
          set -eo pipefail
          echo "=== source about to deploy ==="
          sha256sum supabase/functions/portal/*.ts || true
          wc -c supabase/functions/portal/*.ts
          for attempt in 1 2 3; do
            echo "=== deploy attempt $attempt ==="
            if supabase functions deploy portal --project-ref cmostxcjtbuhbzfojuid --no-verify-jwt 2>&1 | tee /tmp/deploy.log; then
              echo "Deploy exit 0 on attempt $attempt."
              exit 0
            fi
            echo "Deploy exited non-zero on attempt $attempt."
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "::error::Deploy failed after 3 attempts. See log above."
          exit 1

      - name: Verify deployment health
        # Fail LOUD if the freshly-deployed function is not the real, booting
        # portal. Historically we've had two failure modes here:
        #  (a) stub / WORKER_ERROR — GET / returns 5xx or wrong body
        #  (b) CLI reports success but Supabase silently didn't accept the
        #      new source (version stays pinned to the last accepted one).
        # (b) is caught by verifying that endpoints defined in the source
        # tree here (and not in older deployed versions) are reachable — if
        # POST {api:tenants_refresh} returns the generic fallback hint, the
        # new source didn't deploy.
        run: |
          URL="https://cmostxcjtbuhbzfojuid.supabase.co/functions/v1/portal"
          echo "Waiting for the new version to propagate..."
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            sleep 5
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 20 "$URL" || echo "000")
            body=$(head -c 120 /tmp/body.txt)
            echo "Attempt $i: HTTP $code | ${body}"
            if [ "$code" = "200" ] && grep -q "portal up" /tmp/body.txt; then
              ok=1; break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::HEALTH CHECK FAILED — GET / did not return 'portal up'."
            exit 1
          fi
          hint=$(curl -s --max-time 20 -X POST "$URL" -H "Content-Type: application/json" -d '{}' || true)
          echo "POST {} -> ${hint:0:140}"
          if ! echo "$hint" | grep -q '"ok":true'; then
            echo "::error::HEALTH CHECK FAILED — POST {} did not return the expected portal response."
            exit 1
          fi
          # Version-drift guard: for every action name declared in the source tree, check
          # that hitting it returns 401 (unauth = wired) rather than the fallback hint
          # (= action not present in deployed code).
          for action in tenants_refresh; do
            if ! grep -rq "\"$action\"" supabase/functions/portal; then
              echo "action $action not in source, skipping"
              continue
            fi
            resp=$(curl -s --max-time 20 -X POST "$URL" -H "Content-Type: application/json" -d "{\"api\":\"$action\"}" || true)
            echo "POST {api:$action} -> ${resp:0:140}"
            if echo "$resp" | grep -q "ModifiedAfter+ID-reconcile"; then
              echo "::error::HEALTH CHECK FAILED — {api:$action} fell through to the fallback hint. The new source did not deploy (CLI likely reported success but Supabase didn't accept the update). Check SUPABASE_ACCESS_TOKEN validity."
              exit 1
            fi
            if ! echo "$resp" | grep -qE 'unauthorized|forbidden'; then
              echo "::warning::{api:$action} returned an unexpected shape but not the fallback hint; treating as OK."
            fi
          done
          echo "✅ Health check PASSED — real portal live + new actions wired."

      - name: Smoke test — auth still enforced & new actions wired
        # The health check above proves the function BOOTS and that new action names exist. This proves it
        # still BEHAVES: that an authenticated-only action refuses an anonymous caller, and that the
        # actions this release added actually answer. Deliberately credential-free so it can run in CI.
        run: |
          set -e
          URL="https://cmostxcjtbuhbzfojuid.supabase.co/functions/v1/portal"
          post() { curl -s --max-time 20 -X POST "$URL" -H "Content-Type: application/json" -d "$1" || true; }
          fail=0

          # 1. An admin-only action MUST refuse an anonymous caller. If this ever returns data, the auth
          #    gate has regressed and every company's payroll is readable without a session.
          for action in hr_payroll_data hr_emp_save hr_stat_ids_get hr_rc_list; do
            r=$(post "{\"api\":\"$action\"}")
            if echo "$r" | grep -qE '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "::error::AUTH REGRESSION — {api:$action} answered ok:true with no token. Response: ${r:0:200}"
              fail=1
            else
              echo "✓ $action refuses anonymous"
            fi
          done

          # 2. The error beacon must accept a report without a session — boot-time failures happen before
          #    login, and a beacon that needs auth would miss exactly the errors worth seeing.
          r=$(post '{"api":"client_error","message":""}')
          echo "$r" | grep -q '"ok":true' || { echo "::error::client_error beacon did not answer: ${r:0:200}"; fail=1; }
          echo "✓ client_error beacon reachable"

          # 3. Version hint present (confirms the fallthrough handler is the current build).
          r=$(post '{"api":"__ping__"}')
          echo "$r" | grep -qE 'portal v[0-9]+' || { echo "::error::__ping__ returned no version hint: ${r:0:200}"; fail=1; }
          echo "✓ version: $(echo "$r" | grep -oE 'portal v[0-9]+')"

          exit $fail
